[package]
name = "grokbot_api"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "BSD-3-Clause"
authors = ["Michael Christenson II <m3talsmith@gmail.com>", "Weird Brains <weirdbrains@gmail.com>"]
description = "Unofficial async client for the (undocumented) Grok Bot gateway API"
repository = "https://github.com/WeirdBrains/grokbot_api"
homepage = "https://github.com/WeirdBrains/grokbot_api"
documentation = "https://docs.rs/grokbot_api"
readme = "README.md"
keywords = ["grok", "grokbot", "api-client", "gateway", "async"]
categories = ["api-bindings", "web-programming::http-client", "asynchronous"]
include = ["/src", "/tests", "/examples", "/*.md", "/LICENSE"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

# desktop-session only
base64 = { version = "0.23.1", optional = true }
aes = { version = "0.9.3", optional = true }
cbc = { version = "0.2.1", features = ["alloc"], optional = true }
pbkdf2 = { version = "0.13.0", default-features = false, optional = true }
hmac = { version = "0.13.0", optional = true }
sha1 = { version = "0.11.0", optional = true }

[target.'cfg(windows)'.dependencies]
aes-gcm = { version = "0.11.1", optional = true }

[features]
default = []
# Read and decrypt the Grok Bot desktop app's saved gateway session (Chromium Safe Storage).
desktop-session = ["dep:base64", "dep:aes", "dep:cbc", "dep:pbkdf2", "dep:hmac", "dep:sha1", "dep:aes-gcm"]

[dev-dependencies]
aes-gcm = "0.11.1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"

[[example]]
name = "desktop_session"
required-features = ["desktop-session"]
